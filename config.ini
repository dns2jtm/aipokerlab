[ocr]
# OCR Configuration
max_retries = 4
retry_base_delay = 1.0
retry_max_delay = 8.0
enable_position_detection = true
poll_interval_active = 1.0
poll_interval_idle = 5.0
window_position_cache_ttl = 30

[card_positions]
# Learned card positions (x,y,w,h as fractions of window size)
# Format: client_name = x,y,w,h
ggpoker_hole_cards = 0.433,0.72,0.134,0.128
pokerstars_hole_cards = 0.438,0.55,0.124,0.06
pokerfair_hole_cards = 0.438,0.48,0.124,0.06

[postflop]
# Postflop configuration
enable_numpy = true
default_iterations = 1000
implied_odds_buffer = 0.15
use_native_solver = true
native_search_ms = 250

# Postflop auto-detection settings
enable_auto_detect = true
auto_detect_interval = 2.0
auto_update_board = true
auto_update_pot = true
auto_update_call_amount = true
show_detection_status = true

[ui]
# UI Configuration
show_ocr_status = true
show_last_hand = true
status_update_interval = 0.5
window_opacity = 100
enable_sound_notifications = true
minimize_to_tray = false
show_confidence_percentages = true

[strategy]
# Strategy Configuration
profile = ABC
aggression_factor = 1.0
stack_depth = 100
custom_range_file = 

[performance]
# Performance Configuration
enable_sleep_mode = false
sleep_mode_timeout = 300
memory_cleanup_threshold = 200
enable_lazy_loading = true

[autonomy]
# Humanized Autonomous Action Execution
enabled = false
min_delay = 0.80
max_delay = 2.20
enter_bet_sizing = true
dry_run = false
